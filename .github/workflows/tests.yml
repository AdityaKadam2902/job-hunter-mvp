name: Tests

# Runs the regression suite automatically on every push and pull request.
# This is the actual point of having tests at all — a bug fix that isn't
# checked automatically will eventually get silently reverted by a future
# edit. This workflow is what makes that impossible instead of just unlikely.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest pydantic pydantic-settings

      - name: Run regression tests
        run: pytest tests/ -v