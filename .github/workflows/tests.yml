name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        env:
          DATABASE_URL: postgresql+psycopg2://placeholder:placeholder@localhost/placeholder
        run: pytest tests/ -v